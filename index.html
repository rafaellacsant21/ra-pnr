<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PNR em RA</title>
<style>
  html, body { margin: 0; height: 100%; background: #161615; color: #f1efe9;
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; box-sizing: border-box; text-align: center; }
  a.ra { border-radius: 999px; padding: 18px 34px; font-weight: 650; text-decoration: none; background: #5fb894; color: #0e1a15; }
  p { margin: 0; color: #a8a49b; font-size: .92rem; max-width: 30em; }
</style>
</head>
<body>
<main>
  <a class="ra" id="ra" href="#">Abrir em RA</a>
  <p id="dica">Aponte para o chão e toque para posicionar. O apartamento aparece em tamanho real, com a origem no centro da sala.</p>
</main>
<script>
  // Android: abre direto o visualizador de RA do Google (câmera), em tamanho real e sem redimensionar.
  // iPhone: abre o AR Quick Look com o USDZ.
  const base = location.href.split('#')[0].replace(/[^/]*$/, '');
  const ua = navigator.userAgent;
  const ra = document.getElementById('ra');
  if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) {
    ra.rel = 'ar';
    ra.href = base + 'pnr.usdz';
    ra.innerHTML = '<img alt="" style="display:none">Abrir em RA';  // o Quick Look exige um <img> dentro do link
  } else {
    const glb = base + 'pnr.glb';
    ra.href = 'intent://arvr.google.com/scene-viewer/1.2?file=' + encodeURIComponent(glb) +
      '&mode=ar_only&resizable=false&title=' + encodeURIComponent('Apartamento PNR') +
      '#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;' +
      'S.browser_fallback_url=' + encodeURIComponent('https://play.google.com/store/apps/details?id=com.google.ar.core') + ';end';
    if (/Android/.test(ua)) location.href = ra.href;  // tenta abrir sozinho; se o navegador bloquear, fica o botão
  }
</script>
</body>
</html>
